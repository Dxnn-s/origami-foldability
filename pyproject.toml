[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-foldability"
version = "0.1.0"
description = "Flat-foldability analysis for crease patterns (single-vertex: Kawasaki + Maekawa)."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
